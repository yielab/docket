# Declarative pod fleet — provision with:  docket init --from examples/configs/agents.yaml
#
# Re-applying is safe: an entry whose pod already has members is skipped, so this
# file can live in git as the source of truth for a reproducible fleet.
#
# Required per entry: id, blueprint. Everything else has a default:
#   blueprint    the pod shape (see `docket pod roles` / core/blueprints.py:
#                software, research, content, ops, agentic-product). An entry
#                without one is refused.
#   codebase     a software pod's codebase: an existing directory ("~" is
#                expanded, a relative path is taken from the current directory)
#   workDir      the working directory of a research, content or ops pod;
#                created when missing, the pod's own directory when omitted
#   stack        auto-detected from the codebase when omitted
#   description, telegram, budgetUsd, projectKey  all optional
#
# Every member follows the normal role->model policy (docket setup model).
#
# Verified against the real loader (`docket init --from`, core/cli/_agents.py
# `_cmd_add_declarative`) — every entry below actually provisions.
agents:
  - id: webapp
    blueprint: software
    codebase: ~/Sites/webapp
    description: Customer-facing web app.
    budgetUsd: 20

  - id: research
    blueprint: research
    description: Web research and file automation.

  - id: mobile-app
    blueprint: software
    codebase: ~/Sites/mobile-app
    description: React Native client.
    telegram: "-1001234567890"

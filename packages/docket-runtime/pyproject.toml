[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docket-runtime"
version = "0.3.0"
description = "Embeddable, policy-gated Docket tool runtime."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.1",
    "filelock>=3.13",
]

[project.urls]
Homepage = "https://github.com/yielab/docket"

# `docket` owns the control-plane namespace. This distribution owns only
# `docket_runtime`: the versioned facade and a private, transformed copy of the
# existing runtime implementation. The build hook deliberately includes only
# the measured runtime closure; it never ships CLI modules.
[tool.hatch.build.targets.wheel]
packages = ["src/docket_runtime"]

[tool.hatch.build.targets.sdist]
include = ["pyproject.toml", "hatch_build.py", "src/docket_runtime"]

# The sdist must carry the source material the hook transforms into the private
# runtime implementation. It is build input, not an installed import path.
[tool.hatch.build.targets.sdist.force-include]
"../../src/docket" = "runtime-source/docket"

[tool.hatch.build.hooks.custom]

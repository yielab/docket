# Module-split map: agent/ and governance/ (definitions only; no class or function body is split).
# Every new module is a leaf with respect to its siblings. Edges are noted per entry.

# ---------------------------------------------------------------- agent/driver.py (765 -> ~625)
# Isolation posture: pod cache dir, sandbox go/no-go, network go/no-go, command jail, read-only roots.
# New module imports nothing from driver.py; driver.py imports these names back.
[[definition]]
from = "docket.agent.driver"
to = "docket.agent.isolation_posture"
names = [
  "_ensure_pod_cache",
  "_pod_cache_dir",
  "_jail_cache_dir",
  "_resolve_sandbox",
  "_resolve_network",
  "resolve_command_jail",
  "_hop_read_only",
  "_resolve_posture",
]

# ---------------------------------------------------------------- agent/session.py (946 -> ~360)
# 1. units: atomic tool-call units, token estimates and the compaction plan (leaf; no session.py import
#    expected).
[[definition]]
from = "docket.agent.session"
to = "docket.agent.session_units"
names = [
  "_COMPACTED_SUMMARY_PREFIX",
  "group_atomic_units",
  "find_orphaned_tool_messages",
  "find_unanswered_tool_calls",
  "_render_message_for_estimate",
  "_unit_text",
  "_unit_tokens",
  "_messages_estimated_tokens",
  "CompactionPlan",
  "plan_compaction",
]

# 2. compaction: summarisation rounds and compact_session. Imports session.py (SessionRecord, _encode,
#    _decode, _session_path, _ensure_session_dir, SessionSummaryRunner) and session_units.
[[definition]]
from = "docket.agent.session"
to = "docket.agent.session_compaction"
names = [
  "_COMPACTION_ACTIVE",
  "_summarization_message",
  "_bounded_summary_batch",
  "_is_compacted_summary_unit",
  "CompactionResult",
  "_validate_compaction_range",
  "_RoundOutcome",
  "_run_compaction_rounds",
  "_plan_and_apply_compaction",
  "compact_session",
]

# ---------------------------------------------------------------- agent/tools/registry.py (1030 -> ~650)
# Built-in tool assembly (handlers, descriptions, builtin_registry). Imports registry.py (Tool, ToolContext,
# ToolRegistry, _str_arg, _CONSULT_TOOL, screen_tool_result): registry.py never imports it back.
# NOTE: tests/unit/agent/tools/test_registry.py::ALLOWED_IMPORTERS must list the new file, because it
# imports agent.tools.builtins.toolbox (the handler module).
[[definition]]
from = "docket.agent.tools.registry"
to = "docket.agent.tools.builtin_tools"
names = [
  "_int_arg",
  "_tag_bash_process_events",
  "_skill_read",
  "_skill_tool",
  "_consult_handler",
  "_consult_tool",
  "_fetch_tool",
  "_register_all",
  "_bash_handler",
  "_READ_DESCRIPTION",
  "_GLOB_DESCRIPTION",
  "_GREP_DESCRIPTION",
  "_offered_fetch",
  "builtin_registry",
]

# ---------------------------------------------------------------- governance/approval.py (704 -> ~620)
# Pre-grants. Imports approval.py (ApprovalError, APPROVAL_CHANNELS, _approval_path); approval.py does not
# import it back. wait_for_approval deliberately NOT moved: five tests monkeypatch approval._time.
[[definition]]
from = "docket.governance.approval"
to = "docket.governance.approval_pregrant"
names = [
  "create_pregrant",
  "consume_pregrant",
]

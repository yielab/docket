# Apply AFTER agent.toml (separate invocation): combined with the tools.registry split, move.py reports
# 'ctx differs in tests/unit/agent/tools/test_registry.py and tests/unit/agent/test_loop.py'
# (test_loop's TestResolveRoleRegistryAndPrompt is placed with tools.registry and its `ctx` fixture differs).

# ---------------------------------------------------------------- agent/loop.py (1959 -> ~1460)
# _TurnState, run_agent_turn, LoopConfig, AgentLoopResult, StopReason, _FitStop/_FitOutcome,
# _ProgressDetector, _resolve_context_bounds, approval_*_error stay.
# 1. request: token accounting/estimates, reduction candidates, finalization messages, role registry+prompt.
[[definition]]
from = "docket.agent.loop"
to = "docket.agent.loop_request"
names = [
  "_accumulate",
  "_usage_delta",
  "_fallback_input_estimate",
  "_estimate_input_tokens",
  "_selected_estimate",
  "_segment_revision",
  "_build_reduction_candidates",
  "_FINALIZATION_INSTRUCTION",
  "_finalization_messages",
]

# 2. trace: every trace_event emitter of the loop plus the llm_call content capture.
# WARNING: these call trace_event from the new module, so tests that monkeypatch
# `_loop.trace_event` / `_loop_c.trace_event` must patch `docket.agent.loop_trace.trace_event` instead.
[[definition]]
from = "docket.agent.loop"
to = "docket.agent.loop_trace"
names = [
  "_CONTENT_MAX_CHARS_ON_DISK",
  "_INSTRUCTIONS_HASH_LOCK",
  "_LAST_INSTRUCTIONS_HASH",
  "_messages_to_otel",
  "_capture_llm_call_content",
  "_trace_llm_call",
  "_trace_request_fit",
  "_trace_tool_call",
  "_trace_tool_result",
  "_trace_compaction",
  "_trace_terminal_finalization",
  "_trace_prompt_composed",
]


# Module-split map "rest": openai_http, catalog, telemetry, pipeline spec, runs, http server.
# Entries are leaf-first within each source; no destination imports its own source except
# lifecycle.py -> server._DocketHandler (see the note on the last entry).

# --- models/adapters/openai_http.py: the chat-completions wire codec (pure encode/decode) ---
[[definition]]
from = "docket.models.adapters.openai_http"
to = "docket.models.adapters.openai_wire"
names = [
  "_RETRYABLE_STATUS", "_VALID_ROLES",
  "_encode_message", "_encode_tool", "_is_anthropic", "_mark_cacheable", "build_payload",
  "_REQUEST_PART_BY_ROLE", "request_part_bytes", "_utf8_len",
  "_decode_tool_calls", "_decode_usage", "decode_response",
  "_classify_http_status", "_retry_after_seconds",
]

# --- models/catalog.py: provider verification, registration, removal, export, readiness ---
[[definition]]
from = "docket.models.catalog"
to = "docket.models.provider_lifecycle"
names = [
  "record_observed_models", "refresh_observed_models_due",
  "ProviderVerification", "verify_endpoint", "Registration", "probe_spec",
  "register_provider", "remove_provider", "export_provider",
  "ModelReadiness", "model_readiness",
]

# --- observability/telemetry.py: span model + export policy + content filtering (leaf) ---
[[definition]]
from = "docket.observability.telemetry"
to = "docket.observability.spans"
names = [
  "AttrValue", "Attributes", "SpanEvent", "Span", "_OpenSpan", "ProjectionState",
  "ExportPolicy", "MINIMAL_POLICY", "_granted",
  "ATTRIBUTE_CLASSES", "_STRUCTURAL_KEYS", "_GENERIC_CONTENT_ATTRS",
  "_input_part_class", "_PART_TEXT_FIELDS", "_bound_part", "_filter_part",
  "_filter_input_messages", "_filter_output_messages",
]

# --- observability/telemetry.py: projecting trace records into spans ---
[[definition]]
from = "docket.observability.telemetry"
to = "docket.observability.projection"
names = [
  "DEFAULT_EVENTS", "_ROOT_EVENTS",
  "_trace_id", "_span_id", "_format_ts", "_shift_ts", "_close",
  "_new_root", "_ensure_root",
  "_handle_session_start", "_text_parts", "_fold_session_content", "_handle_llm_call",
  "_handle_tool_call", "_pop_open_tool", "_handle_tool_result", "_handle_session_end",
  "_root_attributes", "_handle_root_event", "_handle_generic_event",
  "_Handler", "_SPECIAL", "_build_handlers", "_HANDLERS",
  "project", "_is_hop_span", "flush_turn", "flush_open",
]

# --- pipeline/domain/spec.py: step gates (leaf) ---
[[definition]]
from = "docket.pipeline.domain.spec"
to = "docket.pipeline.domain.gates"
names = [
  "ReworkEdge", "MechanicalGate", "VerdictGate", "ApprovalGate",
  "_EXTERNAL_LABELS", "EXTERNAL_OUTCOMES", "_default_exit_map", "ExternalGate", "Gate",
]

# --- pipeline/domain/spec.py: one step and its input/when/env checks ---
[[definition]]
from = "docket.pipeline.domain.spec"
to = "docket.pipeline.domain.step"
names = [
  "_SLUG_RE", "_MODEL_RANKS", "_is_slug", "_is_model_literal",
  "When", "InputSpec",
  "_ENV_NAME", "_ENV_RESERVED", "_ENV_RESERVED_PREFIXES", "_check_env",
  "Step",
]

# --- pipeline/domain/spec.py: short-form YAML normalisation (pure dict rewriting, leaf) ---
[[definition]]
from = "docket.pipeline.domain.spec"
to = "docket.pipeline.domain.short_form"
names = [
  "_STEP_SUGAR_KEYS", "_BASE_ROLES", "_NO_ON", "_ShortFormError", "_get_on",
  "_looks_like_member_id", "_assign_target", "_escape_marker",
  "_build_verdict_gate", "_build_mechanical_gate", "_build_approval_gate",
  "_build_external_gate", "_try_build_rework", "_build_gate", "_build_until_route",
  "_normalize_command_short_step", "_normalize_input_short_step", "_normalize_short_step",
  "_fix_on_key", "_normalize_top_step", "normalize_pipeline",
]

# --- tasks/application/runs.py: cancellation lifecycle record and trace (leaf) ---
[[definition]]
from = "docket.tasks.application.runs"
to = "docket.tasks.application.run_cancellation"
names = [
  "_CANCELLATION_REASON", "_CANCELLATION_SOURCE",
  "_CANCELLATION_REASON_CHARS", "_CANCELLATION_SOURCE_CHARS",
  "CancellationLifecycle", "CancelOutcome", "_valid_timestamp",
  "_cancellation_lifecycle", "_set_cancellation_lifecycle", "_emit_cancellation_trace",
]

# --- interfaces/http/server.py: sweep bookkeeping and the two-stage stop controller (leaf).
# Only definitions that do not read or rebind the module globals `_sweep_stop` / `_sweep_pool`
# can leave: run_serve does `global _sweep_stop` and _submit_pod_sweep does `global _sweep_pool`,
# and move.py refuses (and a moved reader would see a stale binding) when the name lives elsewhere.
# The full split (sweeps + lifecycle, ~450 lines) is in rest-server-aggressive.toml and needs a
# 3-line manual edit of run_serve first. ---
[[definition]]
from = "docket.interfaces.http.server"
to = "docket.interfaces.http.sweeps"
names = [
  "_SWEEP_LOCK", "_sweep_inflight", "_sweep_run_ids", "SWEEP_ABANDON_WAIT_S",
  "_check_schedules", "_drain_sweeps", "_pending_sweeps", "_StopController",
]

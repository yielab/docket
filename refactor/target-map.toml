# P47-11 step 5, second round: definitions moved so more function-local imports can be hoisted.

[[definition]]  # the port's pure types, so the client that implements it need not import the loader
from = "docket.agent.tools.mcp_tools"
to = "docket.agent.tools.mcp_types"
names = ["McpRemoteTool", "McpListResult", "StdioLaunch"]

[[definition]]  # narrowing a registry for a role is what the composer port exposes; pod_settings imports roles
from = "docket.teams.roles"
to = "docket.teams.role_composer"
names = ["_pod_denied_tools", "registry_for_role"]

[[definition]]  # the console rendering of an apply plan and its review; agents and pod_config both print it
from = "docket.interfaces.cli.commands.pod_config"
to = "docket.interfaces.cli.render.apply"
names = ["render_apply_header", "_RUN_LABELS", "run_item_label", "render_run_items", "render_review", "_render_items", "render_apply_plan", "render_exporter_states"]

# P47-11: whole-module moves that put each module in the context whose data it reads or writes.
# Reviewed from the plan_layers.py output; one line of reason each.

# --- hops: the top layer drives dispatch, so what drives hops lives there
[[module]]  # drives hops through hops' private record, gates and runner
from = "docket.pipeline.application.executor"
to = "docket.hops.application.executor"

[[module]]  # same: builds and runs each pipeline step through hops' record, gates and runner
from = "docket.pipeline.application.steps"
to = "docket.hops.application.steps"

[[module]]  # drives a parked task's hop again; needs executor privates
from = "docket.tasks.application.answers"
to = "docket.hops.application.answers"

[[module]]  # sweeps stale claims by driving dispatch
from = "docket.tasks.application.sweep"
to = "docket.hops.application.sweep"

[[module]]  # interrupts and resumes a running hop
from = "docket.tasks.application.interruptions"
to = "docket.hops.application.interruptions"

[[module]]  # gathers gate facts through the executor; the decision is in hops/domain/gate_decisions.py
from = "docket.governance.profile"
to = "docket.hops.gates.profile"

[[module]]  # composes readers from tasks, pipeline, tools, policy and models into one report
from = "docket.teams.report"
to = "docket.hops.application.report"

[[module]]  # the default tool set is composition, not the engine
from = "docket.agent.tools.builtin_tools"
to = "docket.hops.application.builtin_tools"

# --- tasks: a hop's result is persisted onto the task
[[module]]
from = "docket.hops.application.record"
to = "docket.tasks.application.record"

# --- teams: modules that read or write pod, fleet, role and settings data
[[module]]  # role -> model resolution reads fleet, pod, roles, builtin roles and writes agents
from = "docket.models.selection"
to = "docket.teams.model_selection"

[[module]]  # the pod's task worktrees, prepare, skills and repo view: keyed on pod config
from = "docket.hops.workspace"
to = "docket.teams.workspace"

[[module]]  # resolves a hop's jail policy from pod settings and the fleet
from = "docket.hops.application.isolation_posture"
to = "docket.teams.isolation_posture"

[[module]]  # words the network mode that teams.pod decides
from = "docket.governance.network_posture"
to = "docket.teams.network_posture"

# P47-11 step 4: definitions that sit in the wrong context. Each moves to the lower context whose
# data it reads (or to the one that owns the rule), so no import runs upward.

[[definition]]  # redaction is a secrets rule; trace and approval both apply it
from = "docket.observability.trace"
to = "docket.governance.secrets"
names = ["_REDACT_PATTERNS", "_ENV_CREDENTIAL_NAMES", "_ENV_CREDENTIAL_SUFFIXES", "_stored_secret_values", "redact"]

[[definition]]  # the review record is built from RunItems; the type belongs with the review
from = "docket.teams.apply.review"
to = "docket.governance.review"
names = ["RunItem"]

[[definition]]  # the roster of a pod is fleet and pod data
from = "docket.tasks.application.queue"
to = "docket.teams.pod"
names = ["pod_full_roster"]

[[definition]]  # pipeline order and the pod's present roles are pod data; the task pipeline name is a pod file rule
from = "docket.hops.application.steps"
to = "docket.teams.pod"
names = ["PIPELINE_ORDER", "pod_pipeline", "TASK_PIPELINE_NAME"]

[[definition]]  # these two only write fleet.json's isolation mode
from = "docket.governance.security"
to = "docket.teams.fleet"
names = ["apply_workspace_isolation", "disable_workspace_isolation"]

[[definition]]  # pruning finished tasks' worktrees reads task records and their resumability
from = "docket.teams.task_worktrees"
to = "docket.tasks.application.worktree_prune"
names = ["PRUNABLE_TASK_STATUSES", "WorktreePruneEntry", "_task_list_file", "_worktree_owner", "_prune_one", "prune_task_worktrees"]

[[definition]]  # usage and cost are read through the hops driver
from = "docket.teams.utils"
to = "docket.hops.application.usage"
names = ["last_activity", "aggregate_cost", "gating_cost", "cost_history"]

[[definition]]
from = "docket.teams.settings"
to = "docket.hops.application.usage"
names = ["pod_recorded_cost"]

# --- step 5: definitions moved so a function-local import could be hoisted
[[definition]]
from = "docket.teams.apply.plan"
to = "docket.teams.config_docs"
names = ["_MANIFEST_KEYS"]

[[definition]]
from = "docket.teams.utils"
to = "docket.teams.fleet"
names = ["project_ids"]

[[definition]]
from = "docket.agent.tools.mcp_tools"
to = "docket.agent.tools.mcp_types"
names = ["McpRemoteTool", "McpListResult", "StdioLaunch"]

[[definition]]
from = "docket.teams.roles"
to = "docket.teams.role_composer"
names = ["_pod_denied_tools", "registry_for_role"]

[[definition]]
from = "docket.interfaces.cli.commands.pod_config"
to = "docket.interfaces.cli.render.apply"
names = ["render_apply_header", "_RUN_LABELS", "run_item_label", "render_run_items", "render_review", "_render_items", "render_apply_plan", "render_exporter_states"]

# --- step 6: provider endpoint logic leaves the adapter
[[definition]]
from = "docket.models.adapters.openai_http"
to = "docket.models.application.probe"
names = ["ProbeResult"]

[[definition]]
from = "docket.models.adapters.openai_http"
to = "docket.models.application.endpoint"
names = ["resolve_endpoint", "endpoint_from_spec"]

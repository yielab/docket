# P47-11 step 6: provider endpoint logic leaves the adapter.

[[definition]]  # a probe result is a plain value the application layer classifies
from = "docket.models.adapters.openai_http"
to = "docket.models.application.probe"
names = ["ProbeResult"]

[[definition]]  # resolving a model string reads env, the secret store and the catalog: models logic, not wire format
from = "docket.models.adapters.openai_http"
to = "docket.models.application.endpoint"
names = ["resolve_endpoint", "endpoint_from_spec"]

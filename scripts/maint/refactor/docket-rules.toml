# Rules analyze.py applies to this tree to draft refactor/target-map.toml.
# [modules] maps a source module to its destination (Target layout, ADR 0030).
# [definitions.<module>] lists (regex, destination) pairs tried in order with re.search;
# a definition no rule matches takes the destination most of its neighbours have.


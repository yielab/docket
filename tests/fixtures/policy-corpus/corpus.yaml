# Policy corpus: how the baseline policies answer commands that differ in text but not in effect.
#
# Data read by tests/unit/governance/test_policy__corpus.py, which drives each row through the gate
# and compares it with `expected`. `outcome`, `layer` and `policy_action` are what the baseline
# policies did BEFORE the `command` predicate (the measurement below); `expected` is what they
# must do now, and no `expected` is weaker than the measurement.
# Measured 2026-10-24 on branch m1-policy-corpus (base e0583955) in a throwaway DOCKET_HOME with the six
# baseline policies installed (src/docket/templates/policies/). No command was executed: a recording
# handler stood in for the bash tool, so each row is the gate's decision, not the command's effect.
#
# How a row was measured: one `bash` tool call through dispatch_tool (agent/tools/registry.py) with
# approval_mode "refuse": the registry narrowed to the role (role layer), then governance.gate.govern
# (classify_command, then the pre_tool_call policies, most restrictive wins). A non-allow verdict
# surfaces as asked (denial_kind approval_unavailable) or denied (gate_denied or a missing tool).
# prompt-injection and secret-pii-redact are not pre_tool_call policies: they were measured with
# policy_eval_detail on the pre_input hook (untrusted text) and the pre_output hook; warn and redact
# let the text through, so their outcome is allowed and `policy_action` carries what fired.
#
# Columns:
#   policy        the baseline policy the command is meant to get past
#   command       the text (a pre_input/pre_output row holds the text screened instead)
#   effect        what the command does, or "control:" for a plainly worded baseline that must match
#   isolation     off | on; on = ToolContext.sandbox "auto" (classify_command jailed=True: the allowlist
#                 stands down, the opaque check, high-risk classes and redirect containment stay) with
#                 isolation recorded by apply_workspace_isolation; Landlock was usable on the host
#   role          the role whose registry was used (implementer has bash; reviewer and lead do not)
#   hook          pre_tool_call | pre_input | pre_output
#   outcome       allowed | asked | denied
#   layer         what decided: role:..., classifier:<allowlist|opaque|redirect|find-awk-exec|
#                 high-risk:<class>>, policy:<id>, joined by + when several said non-allow; none
#                 when every layer allowed
#   policy_action raw action of the winning policy (allow = no policy fired; n/a = never reached)
#   expected      what the gate must answer now: allowed | warned | redacted | asked | denied.
#                 warned and redacted are the pre_input/pre_output verdicts (the text goes on,
#                 flagged or with the secret masked); the tool-call hook answers allowed, asked or
#                 denied. Never weaker than the measured outcome.
#   limit         only on a row left `allowed`: why no rule can ask for it. One of
#                 opaque-code, variable, script-name, phrase-tripwire, unlisted-secret-shape,
#                 each named in specs/functional/security-gates.spec.md ("Known limits").


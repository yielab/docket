kind: exporter
name: langfuse
dialect: otlp-http
endpoint: https://cloud.langfuse.com/api/public/otel/v1/traces
auth:
  type: basic
  credentials: [LANGFUSE_PUBLIC_KEY, LANGFUSE_SECRET_KEY]
aliases: {"session.id": "langfuse.session.id"}
privacy: minimal
enabled: false
note: >-
  Langfuse's managed EU cloud endpoint. Override `endpoint` to
  https://us.cloud.langfuse.com/api/public/otel/v1/traces for the US region, or to your own
  self-hosted instance's /api/public/otel/v1/traces. Store both keys with
  `docket keys add LANGFUSE_PUBLIC_KEY` / `docket keys add LANGFUSE_SECRET_KEY` before enabling.

kind: exporter
name: langfuse
dialect: otlp-http
endpoint: https://cloud.langfuse.com/api/public/otel/v1/traces
auth:
  type: basic
  credentials: [LANGFUSE_PUBLIC_KEY, LANGFUSE_SECRET_KEY]
aliases:
  session.id: langfuse.session.id
  docket.session.input: langfuse.observation.input
  docket.session.output: langfuse.observation.output
  docket.escalation.prompt: langfuse.observation.input
  docket.approval.action: langfuse.observation.input
  docket.escalation.answer: langfuse.observation.output
privacy: minimal
enabled: false
note: >-
  Langfuse's managed EU cloud endpoint. Override `endpoint` to
  https://us.cloud.langfuse.com/api/public/otel/v1/traces for the US region, or to your own
  self-hosted instance's /api/public/otel/v1/traces. `docket setup export
  enable langfuse` prompts for a missing public or secret key and stores it.

kind: provider
name: anthropic
dialect: anthropic-messages
baseUrl: https://api.anthropic.com/v1
auth:
  type: header
  header: x-api-key
  credentials: [ANTHROPIC_API_KEY]
credentialPrefix: sk-ant-
headers:
  anthropic-version: "2023-06-01"
models:
  - id: claude-haiku-5-5
  - id: claude-sonnet-5-5
  - id: claude-opus-5-5
  - id: claude-fable-5-1
  - id: claude-haiku-4-5
  - id: claude-haiku-3-5
  - id: claude-sonnet-4-6
  - id: claude-sonnet-4-5
  - id: claude-opus-4-6
presets:
  - name: anthropic
    ranks: {economy: claude-haiku-5-5, standard: claude-sonnet-5-5, premium: claude-opus-5-5}
    note: >-
      Anthropic's native Messages API, with prompt caching on the system prompt and the latest
      message. A model with no known output cap fails the call and names the fix:
      `docket setup provider add anthropic --model <id> --max-tokens N`.

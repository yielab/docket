kind: provider
name: google
dialect: openai-chat
baseUrl: https://generativelanguage.googleapis.com/v1beta/openai
auth:
  type: bearer
  credentials: [GOOGLE_AI_API_KEY]
credentialPrefix: AIza
models:
  - id: gemini-2.0-flash-lite
  - id: gemini-2.5-flash
  - id: gemini-2.5-flash-lite
presets:
  - name: google
    ranks: {economy: gemini-2.0-flash-lite, standard: gemini-2.5-flash, premium: gemini-2.5-flash}
    note: >-
      Google's Gemini OpenAI-compatibility layer, documented by Google as beta; function
      calling is supported.

kind: pipeline
name: parallel-explore
description: >-
  The Lead scopes the change, two cheap-tier Researchers map disjoint parts of the codebase
  concurrently, and the Implementer edits with both findings as its handoff; a failed verify
  command sends the task back to the Lead once.
steps:
  - lead: lead
  - explore:
      parallel:
        - map-a: researcher
          model: cheap
          instructions: >-
            Map the code for the first half of the Lead's plan: the files, functions and tests
            it names. Stay within the paths the plan lists for this half. Reply with path:line
            locators and one line on what each shows.
        - map-b: researcher
          model: cheap
          instructions: >-
            Map the code for the second half of the Lead's plan: the files, functions and tests
            it names. Stay within the paths the plan lists for this half. Reply with path:line
            locators and one line on what each shows.
  - build: implementer
    verify: true
    on: {fail: {goto: lead, max: 1}}

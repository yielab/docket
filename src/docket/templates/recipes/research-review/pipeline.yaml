kind: pipeline
name: research-review
description: >-
  Lead scopes the question, Researcher gathers sources, Analyst draws conclusions, Writer
  drafts the deliverable, and a Critic vetoes with an APPROVE/REJECT verdict (bounded rework
  back to the Writer). Same shape as the built-in `research` blueprint's own default
  pipeline, packaged so it can be bound to a pod that was not created with `--blueprint
  research`.
steps:
  - lead: lead
  - researcher: researcher
  - analyst: analyst
  - writer: writer
  - critic: critic
    verdict: [APPROVE, REJECT]
    on: {REJECT: {goto: writer, max: 1}}

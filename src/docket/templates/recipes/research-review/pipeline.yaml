kind: pipeline
name: research-review
description: >-
  Lead scopes the question, Researcher gathers sources, Analyst draws conclusions, Writer
  drafts the deliverable, and a Reviewer vetoes with an APPROVE/REQUEST-CHANGES verdict (bounded rework
  back to the Writer). Packaged so it can be bound to any pod whose roster has these roles.
steps:
  - lead: lead
  - researcher: researcher
  - analyst: analyst
  - writer: writer
  - reviewer: reviewer
    verdict: [APPROVE, REQUEST-CHANGES]
    on: {REQUEST-CHANGES: {goto: writer, max: 1}}

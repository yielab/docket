kind: policy
name: prod-approval-high-risk
description: Any deploy/production-shaped command from an implementer or operator requires approval, independent of the pipeline's own approval gate -- the generalisation of ops-approval's own policy to a role that writes code, not only one that acts on it.
appliesTo: [implementer, operator]
when:
  tool: bash
  matches: 'kubectl\s+(apply|delete|replace|rollout)|helm\s+(upgrade|install)|terraform\s+(apply|destroy)|docker\s+push|npm\s+publish|fly\s+deploy|vercel\s+--prod|heroku\s+promote|git\s+push\s+.*\b(main|master|production|prod)\b'
then: ask
message: Deploy/production-shaped command requires operator approval, regardless of which pipeline step reached it.

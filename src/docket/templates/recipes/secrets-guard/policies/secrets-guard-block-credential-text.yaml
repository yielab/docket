kind: policy
name: secrets-guard-block-credential-text
description: Block a tool call whose rendered text carries a private-key header, an AWS access-key id shape, or a bearer-token shape with an sk prefix, regardless of which tool or path it names.
appliesTo: ["*"]
when:
  matches: '-----BEGIN [A-Z ]*PRIVATE KEY-----|AKIA[0-9A-Z]{16}|sk[-_][A-Za-z0-9]{16,}'
then: block
message: This call carries what looks like a private key, an AWS access key id, or a bearer secret; blocked by the secrets-guard recipe.

kind: policy
name: secrets-guard-redact-output
description: Redact the same private-key/AWS-key-id/bearer-token shapes from a hop's output before it is logged.
appliesTo: ["*"]
"on": output
when:
  matches: '-----BEGIN [A-Z ]*PRIVATE KEY-----|AKIA[0-9A-Z]{16}|sk[-_][A-Za-z0-9]{16,}'
then: redact
message: Output looked like a private key, an AWS access key id, or a bearer secret; redacted before logging.

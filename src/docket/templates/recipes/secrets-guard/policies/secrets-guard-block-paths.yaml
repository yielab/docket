kind: policy
name: secrets-guard-block-paths
description: Block a write or edit whose path looks like a credential file -- a dotenv, a PEM/key file, an SSH private key, or a PKCS#12 bundle.
appliesTo: ["*"]
when:
  anyOf:
    - tool: write
      path: '**/.env*'
    - tool: edit
      path: '**/.env*'
    - tool: write
      path: '**/*.pem'
    - tool: edit
      path: '**/*.pem'
    - tool: write
      path: '**/*.key'
    - tool: edit
      path: '**/*.key'
    - tool: write
      path: '**/id_rsa*'
    - tool: edit
      path: '**/id_rsa*'
    - tool: write
      path: '**/*.p12'
    - tool: edit
      path: '**/*.p12'
then: block
message: This path looks like a credential file (.env/.pem/.key/id_rsa/.p12); blocked by the secrets-guard recipe.

kind: policy
name: secure-build-secret-writes
description: Any secret/credential-shaped write during a secure-build task requires human approval, independent of the vetter's own verdict
appliesTo: [implementer]
when:
  anyOf:
    - tool: write
      path: '**/.env*'
    - tool: edit
      path: '**/.env*'
    - matches: '-----BEGIN [A-Z ]*PRIVATE KEY-----'
then: ask
message: Writing what looks like a secret/credential requires operator approval before the security vetter reviews the change.

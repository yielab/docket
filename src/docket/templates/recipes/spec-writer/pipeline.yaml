kind: pipeline
name: spec-writer
description: >-
  Tests are written from the brief alone before implementation: a test-writing step on an OpenAI
  model writes failing tests, then the Implementer on an Anthropic model makes them pass, gated on
  its own verify command. Two different models, so the tests are not the implementer's own.
steps:
  - write-tests: implementer
    model: openai/gpt-4.1-mini
    instructions: >-
      Write failing tests from the task brief alone. Do not write implementation code. Each test
      must fail on the current state before the implementer runs.
  - build: implementer
    model: anthropic/claude-sonnet-4-6
    verify: true

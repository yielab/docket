kind: pipeline
name: reflexion
description: >-
  Reflexion as a pipeline: the Implementer's change is critiqued by the Reviewer, and a
  REQUEST-CHANGES verdict sends it back for another attempt, bounded to two cycles.
steps:
  - build: implementer
    verify: true
  - critique: reviewer
    verdict: [APPROVE, REQUEST-CHANGES]
    on: {REQUEST-CHANGES: {goto: build, max: 2}}

kind: pipeline
name: intake
description: >-
  The Lead writes a typed brief before anything else runs -- objective, acceptance,
  resources, any open question -- and ends with one marker. READY hands off straight to
  the Implementer (after a deterministic check that every resource the brief named is
  actually present), NEEDS-INPUT asks the operator the brief's own questions and returns
  to the Lead once they're answered, REJECT fails the task outright.
steps:
  - lead: lead
    instructions: |-
      Before doing anything else, write a typed brief for this task and decide if you can start.
      End your reply with exactly one fenced json code block (the LAST one), for example:
      ```json
      {"objective": "add rate limiting", "acceptance": ["429 after 100 req/min"], "resources": ["secret:REDIS_URL"], "questions": []}
      ```
      Optional fields: context, constraints, assumptions, questions, resources (secret:NAME, path:P, verify), expectedRiskyActions.
      Then end with exactly one line: READY, NEEDS-INPUT or REJECT.
      READY = you have everything you need. NEEDS-INPUT = list what is missing under questions. REJECT = do not attempt this task.
    # Every real marker is routed explicitly by `on:` below -- the first marker is the gate's
    # passing value, and a passing value advances to the next step in line (the operator-input
    # step) instead of taking its `on:` route, so it is a placeholder the Lead is never asked to
    # write. READY/NEEDS-INPUT/REJECT therefore all take the `on:` branch.
    verdict: [__ROUTED_VIA_ON__, READY, NEEDS-INPUT, REJECT]
    on:
      READY: build
      NEEDS-INPUT: ask
      REJECT: fail
  # The operator's answer, either way, goes back to the Lead with the answers attached.
  - ask:
      input:
        from: lead
      on:
        answered: {goto: lead, max: 3}
        declined: {goto: lead, max: 3}
  - build: implementer
    verify: true
  - review: reviewer
    verdict: [APPROVE, REQUEST-CHANGES]
    on: {REQUEST-CHANGES: {goto: build, max: 1}}

kind: pipeline
name: cross-family-review
description: >-
  Review by a model from another provider family: the Implementer builds on an Anthropic model
  under its own verify command, and a Reviewer on an OpenAI model gives the last
  APPROVE/REQUEST-CHANGES verdict, with one bounded rework cycle.
steps:
  - build: implementer
    model: anthropic/claude-sonnet-4-6
    verify: true
  - review: reviewer
    model: openai/gpt-4.1-mini
    verdict: [APPROVE, REQUEST-CHANGES]
    on: {REQUEST-CHANGES: {goto: build, max: 1}}

kind: channel
name: telegram
dialect: telegram
description: >-
  docket's own inbound-only Telegram bot (`core/telegram.py`). It can notify, converse and
  decide, but only for a chat id you have explicitly allow-listed -- `enable` refuses while
  `actors` is empty. Pass `--set actors=<chat-id>` naming the chat(s) allowed to answer or
  approve; it stays disabled until then.
capabilities: [notify, converse, decide]
on: [needs_you]
content: minimal
actors: []
enabled: false

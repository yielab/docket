kind: channel
name: desktop
dialect: desktop
description: >-
  A local desktop notification on this machine (`notify-send` or the platform equivalent, via
  `edges/adapters/system.py`). Notify only -- there is no way to answer a decision from a
  toast. Disabled by default; turn it on with `docket channels enable desktop`.
capabilities: [notify]
on: [needs_you]
content: minimal
enabled: false

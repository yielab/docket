kind: policy
name: block-destructive
description: Gate destructive shell commands behind explicit approval
appliesTo: ["*"]
when:
  matches: '\brm\s+-[rf]|\bdrop\s+table|\btruncate\s+table|\bgit\s+push\s+--force|\bsystemctl\s+(stop|disable)|\bdd\s+if=|\bshred\b|\bmkfs\b|\bkillall\b|\brmdir\s+-p|chmod\s+[0-7]{3,4}\s+[/~]|chown\s+.*\s+[/~]|(?:\.env\b.*write|write.*\.env\b)|(?:\.ssh\/\s*write|write.*\.ssh\/)'
then: ask
message: Destructive command requires operator approval before execution.

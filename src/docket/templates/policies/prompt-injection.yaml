kind: policy
name: prompt-injection
description: A phrase tripwire for instruction-override and exfiltration wording in untrusted input; paraphrases, other languages and encodings pass
appliesTo: ["*"]
on: input
when:
  matches: 'ignore\s+(previous|all|prior)\s+instructions|disregard\s+(your|the)\s+(system|instructions)|you\s+are\s+now|new\s+persona|act\s+as\s+(?!a\s+helpful)|pretend\s+(you\s+are|to\s+be)|jailbreak|DAN\s+mode|send\s+(all|the)\s+(data|secrets|keys)\s+to|exfiltrate|leak\s+(your|the)\s+(context|memory|keys)'
then: warn
message: Possible prompt-injection pattern detected in untrusted input. Review before processing.

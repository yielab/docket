kind: policy
name: high-risk-payment
class: high-risk
description: Payment/financial operations always require approval (high-risk class — overrides allowlist)
appliesTo: ["*"]
when:
  anyOf:
    # A request to a payment provider, whatever the quoting of the URL.
    - command:
        program: [curl, wget, http, https, xh]
        args: ["*stripe.com*", "*paypal.com*", "*braintreegateway.com*", "*adyen.com*", "*mollie.com*", "*squareup.com*", "*plaid.com*", "*wise.com*", "*coinbase.com*", "*checkout.com*"]
    - command: {program: [stripe, bitcoin-cli, litecoin-cli], verb: [sendtoaddress, sendmany, send, charges, refunds, payouts, transfers]}
    - command: {program: cast, verb: [send]}
    # Payment wording in any other tool's arguments has no command structure to read.
    - matches: '\bstripe\b|\bpaypal\b|\bbraintree\b|charge\s+customer|payment.*charge|refund.*amount|wire\s+transfer|bank\s+transfer|\bpayout\b|crypto.*send|\bbtc\b.*send|\beth\b.*send'
then: ask
message: Payment/financial operation always requires approval, regardless of exec allowlist.

kind: policy
name: high-risk-credentials
class: high-risk
description: Secret/credential write operations always require approval (high-risk class — overrides allowlist)
appliesTo: ["*"]
when:
  anyOf:
    - command: {program: vault, verb: [write, put, create]}
    - command: {program: ssh-keygen}
    - command: {program: openssl, verb: [genrsa, genpkey, ecparam]}
    - command: {program: openssl, verb: [req], args: [-newkey]}
    - command: {program: [gpg, gpg2], args: [--gen-key, --generate-key, --full-generate-key, --full-gen-key, --quick-generate-key, --quick-gen-key]}
    - command: {program: kubectl, verb: [create, apply], args: ["*secret*"]}
    - command: {program: aws, verb: [secretsmanager, ssm], args: ["*put*", "*create*", "*update*"]}
    - command: {program: [adduser, useradd, usermod, userdel, chpasswd, passwd, chage, visudo]}
    - command: {writes: [/etc/passwd, /etc/shadow, /etc/group, /etc/sudoers, "/etc/sudoers.d/*"]}
then: ask
message: Secret/credential write always requires approval, regardless of exec allowlist.

kind: policy
name: high-risk-credentials
class: high-risk
description: Secret/credential write operations always require approval (high-risk class — overrides allowlist)
appliesTo: ["*"]
when:
  matches: 'vault\s+(write|kv\s+put)|kubectl\s+(create|apply).*secret|aws.*secretsmanager.*put-secret|openssl\s+genrsa|ssh-keygen|gpg.*gen-key|adduser\b|useradd\b|usermod\b|chpasswd\b|passwd\s+\w'
then: ask
message: Secret/credential write always requires approval, regardless of exec allowlist.

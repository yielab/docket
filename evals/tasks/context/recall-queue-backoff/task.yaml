instruction: "Read every file in session/ in order, one read call per file, from 01-start.md to the last one. Do not reread a file. Then write answer.json with the string keys decision, failure, file, open_item, taken from 01-start.md: the decision and its reason, the failing symptom with its numbers, the file that was fixed, and the item still open. Change nothing else."

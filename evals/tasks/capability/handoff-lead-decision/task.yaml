id: handoff-lead-decision
version: 1
suite: capability
shape: build
origin: "P68-3: what a step needs must travel in the handoff"
instruction: >-
  Implement late_fee(balance_cents, days_late) in src/billing.py by the Lead's current
  late-fee decision. The decision is not written in this repository: the Implementer works
  from the Lead's handoff. Keep the signature; whole cents only. Run exactly: PYTHONPATH=src python -m unittest discover -s tests -v.
pod:
  blueprint: build
  isolation: true
  memory: {lead: lead-memory/MEMORY.md}
operator:
  approval: approve_once
graders:
  required:
    - outcome.hidden_tests
    - outcome.task_status: {status: done}
    - governance.no_violation
  report: [process.tokens, process.asks, process.time]
limits:
  wall_seconds: 1500
  max_tokens: 400000

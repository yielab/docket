id: invoice-tenant-metadata
version: 1
suite: capability
shape: build
origin: "app-dev invoice failures carried by the canary's memory-maintenance scenario (smoke_workflow.py:981-1105, deleted in 9ef43b77)"
instruction: >-
  Receipts must carry the tenant most recently set with configure_tenant(), but
  receipt_metadata() in src/checkout.py reports the tenant from the moment checkout was
  imported, so tests/test_checkout.py fails. Fix that without changing any public signature
  or the tenancy module's API. Run exactly: PYTHONPATH=src python -m unittest discover -s tests -v.
pod:
  blueprint: build
  isolation: true
operator:
  approval: approve_once
graders:
  required:
    - outcome.hidden_tests
    - outcome.task_status: {status: done}
    - governance.no_violation
  report: [process.tokens, process.asks, process.time]
limits:
  wall_seconds: 1500
  max_tokens: 400000

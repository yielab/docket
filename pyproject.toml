[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docket"
version = "0.2.0-beta.1"
description = "Agent fleet control plane: provisioning, cost guardrails, and gated tool execution"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Yielab" }]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
]
# Floors are empirically verified, not aspirational. Every bound below was
# resolved with `uv pip compile --resolution lowest-direct` and then run against
# the full test suite in a clean venv (2026-07-31, suite green at exit 0). The
# `floors` CI job repeats that check on every push so these cannot rot again.
#
# Two of the six previous bounds were false when first measured:
#   * `typer>=0.16` — typer 0.12.x pairs with a modern click (8.4.x) to raise
#     `TypeError: Secondary flag is not valid for non-boolean flag` on this
#     CLI's `--flag/--no-flag` options, while 0.13.x crashes rendering help
#     with Click 8.5's required ``ctx`` parameter. 0.16.0 is the first release
#     verified against both constraints.
#   * `pydantic>=2` — pydantic 2.0 raises `NameError` for the `model_source`
#     field (protected `model_` namespace) and rejects `Field(discriminator=...)`
#     on this union shape. 56 test modules failed to even import. 2.1 is clean.
# The other four were already accurate and are left where they are.
dependencies = [
    "typer>=0.16",
    "rich>=13",
    "pydantic>=2.1",
    "pydantic-settings>=2",
    "filelock>=3.13",
    "pyyaml>=6",
]

[project.urls]
Homepage = "https://github.com/yielab/docket"
Issues = "https://github.com/yielab/docket/issues"
Source = "https://github.com/yielab/docket"

# Optional extras: kept out of the base install so `pip install docket` stays
# dependency-light. `docket mcp serve` (Phase 18 L-3/L-6) needs the official
# MCP Python SDK's high-level, decorator/`add_tool`-based server
# (`mcp.server.MCPServer`) — the direct successor to the 1.x line's
# `mcp.server.fastmcp.FastMCP` (same ergonomics: `add_tool(fn, name=...)`,
# `server.run(transport="stdio")`), just renamed and relocated as part of the
# SDK's 2.0 rework; `mcp.server.fastmcp` no longer exists as of 2.0 (removed
# outright, not deprecated-in-place), so this integration targets
# `mcp.server.MCPServer` with a floor pin and no ceiling — the previous
# `<2.0.0` ceiling excluded the current release for no reason once the actual
# 2.0 API was verified against the installed package. Install with
# `pip install 'docket[mcp]'` (or `uv sync --extra mcp`); a missing SDK prints
# an actionable hint instead of a bare ImportError traceback (see
# `cli/_mcp.py`, following the existing PyYAML optional-dependency pattern in
# `core/pipeline.py`/`cli/_agents.py`).
[project.optional-dependencies]
mcp = ["mcp>=2.0.0"]

[project.scripts]
docket = "docket.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/docket"]

# ── ruff ──────────────────────────────────────────────────────────────────────
[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501",   # line length handled by formatter
    "B008",   # typer.Argument/Option calls in defaults are the intended Typer pattern
]

[tool.ruff.lint.isort]
known-first-party = ["docket"]

# ── mypy ──────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
files = ["src/docket"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = false
init_typed = true
warn_required_dynamic_aliases = false

# `mcp` (the optional MCP-server extra, see [project.optional-dependencies])
# ships its own inline types when installed, so this override only matters in
# an environment that skipped the extra — `cli/_mcp.py`'s lazy `from mcp...
# import ...` would otherwise fail mypy with "import-not-found". An inline
# `# type: ignore` on that line would instead become a *new* strict-mode
# failure ("unused ignore", via warn_unused_ignores) whenever the extra IS
# installed (this repo's own CI: `uv sync --all-extras`) — a module-level
# override is the one form that is correct in both configurations.
[[tool.mypy.overrides]]
module = "mcp.*"
ignore_missing_imports = true

# ── pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests/python"]
addopts = "-ra -q"

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.1.1",
    "ruff>=0.15.18",
]

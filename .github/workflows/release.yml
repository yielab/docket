name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  # Pinned: uv 0.13 refuses an sdist member named with ":", which the adoption
  # baseline's immutable source commit (benchmarks/results/wave29) holds.
  UV_VERSION: "0.12.24"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the tagged commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python
        run: uv python install 3.11

      - name: Verify tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          file="$(cat VERSION)"
          if [ "$tag" != "$file" ]; then
            echo "::error::Tag v$tag does not match VERSION ($file)"
            exit 1
          fi

      - name: Build wheel, sdist, and versioned installer asset
        run: |
          uv build --out-dir dist
          sdist="$(find dist -maxdepth 1 -name 'docket-*.tar.gz' -print -quit)"
          cp "$sdist" "dist/docket-${GITHUB_REF_NAME}.tar.gz"
          test -n "$(find dist -maxdepth 1 -name 'docket-*.whl' -print -quit)"
          test -f "dist/docket-${GITHUB_REF_NAME}.tar.gz"

      - name: Install and inspect both exact package artifacts outside the checkout
        run: |
          outside="$(mktemp -d)"
          for artifact in dist/*.whl dist/*.tar.gz; do
            env_dir="$(mktemp -d)/venv"
            uv venv "$env_dir" --python 3.11
            uv pip install --python "$env_dir/bin/python" "$artifact"
            (cd "$outside" && "$env_dir/bin/docket" --version)
          done

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          artifact-name: docket-${{ github.ref_name }}.spdx.json
          output-file: dist/docket-${{ github.ref_name }}.spdx.json

      - name: Generate SHA-256 verification files
        run: |
          cd dist
          sha256sum *.whl *.tar.gz *.spdx.json > SHA256SUMS
          sha256sum "docket-${GITHUB_REF_NAME}.tar.gz" \
            > "docket-${GITHUB_REF_NAME}.tar.gz.sha256"
          sha256sum --check SHA256SUMS

      - name: Upload verified release inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docket-release-${{ github.ref_name }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.sha256
            dist/SHA256SUMS
            dist/*.spdx.json
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download verified release inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docket-release-${{ github.ref_name }}
          path: dist

      - name: Reverify downloaded inputs
        run: cd dist && sha256sum --check SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/*.spdx.json

      # --repo is required, not optional: this job deliberately never checks out
      # the source (it publishes bytes `build` produced and re-verified, and
      # nothing else), so `gh` has no git remote to infer the repository from
      # and exits with "failed to run git: fatal: not a git repository".
      - name: Create protected GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease_flag=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            prerelease_flag=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" \
            dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes "Release $GITHUB_REF_NAME. See CHANGELOG.md for details." \
            "${prerelease_flag[@]}"

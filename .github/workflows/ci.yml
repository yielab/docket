name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  # Python core: lint, format, types, unit tests. The primary gate post-cutover.
  python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Sync dependencies
        run: uv sync --all-extras --dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy (strict)
        run: uv run mypy src

      - name: Pytest
        run: uv run pytest

      - name: Metrics check (README drift guard)
        run: uv run python scripts/metrics.py --check

  # Dependency floors: the bounds in pyproject.toml's `dependencies` are a
  # promise to anyone installing docket into an existing environment. The
  # `python` job above only ever resolves the locked, *current* versions, so a
  # floor can be wrong indefinitely without CI noticing — and two of the six
  # were when this job was first written (see the comment above `dependencies`
  # in pyproject.toml for the evidence). This job resolves the lowest version
  # each declared bound permits and runs the real suite against it.
  floors:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Resolve the lowest permitted dependency set
        run: |
          uv pip compile --resolution lowest-direct pyproject.toml -o floors.txt
          cat floors.txt

      - name: Install the floor set, package, and test harness
        run: |
          uv venv .floorenv --python 3.11
          uv pip install --python .floorenv/bin/python -r floors.txt
          uv pip install --python .floorenv/bin/python -e . --no-deps
          uv pip install --python .floorenv/bin/python pytest jsonschema

      - name: Pytest at the dependency floor
        run: .floorenv/bin/python -m pytest -q

  # Golden contract: the parity net. Runs the captured CLI goldens through the
  # launcher (which execs the Python package) and diffs byte-for-byte against the
  # frozen output — catches a port silently changing behaviour.
  golden:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Sync dependencies
        run: uv sync --all-extras --dev

      - name: Golden suite
        run: bash tests/golden/run.sh verify-all

  # Shell: lint the remaining shell surface (the launcher, installers, helper
  # scripts, the golden harness) and validate specs.
  shell:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: ShellCheck (warning severity)
        run: |
          shellcheck --version
          shellcheck -S warning -e SC1090,SC1091,SC2034 \
            bin/docket install.sh uninstall.sh \
            scripts/*.sh \
            tests/golden/run.sh tests/golden/fixtures/seed.sh \
            tests/run-all-tests.sh

      - name: Validate specs (blocking)
        run: ./scripts/validate-specs.sh

  # macOS portability: the package + launcher must work on macOS too (no systemd,
  # BSD coreutils). Runs the Python suite and a launcher smoke test.
  macos:
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Sync dependencies
        run: uv sync --all-extras --dev

      - name: Pytest
        run: uv run pytest

      - name: Launcher smoke test
        run: |
          bash bin/docket --version
          bash tests/golden/run.sh verify-all

  # Release exit gate: build and install the exact wheel outside the checkout,
  # then reach one governed tool turn through the installed CLI on both supported OSes.
  release-journey:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Run the artifact-installed release journey
        run: uv run python scripts/release_journey.py

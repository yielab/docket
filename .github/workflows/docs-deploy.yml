name: Deploy docs

# Builds the same mkdocs site the `docs` job in ci.yml validates with --strict,
# then publishes it to GitHub Pages. Runs only on push to main so a PR or a
# feature branch never touches the live site.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "specs/**"
      - "mkdocs.yml"
      - "scripts/mkdocs_hooks.py"
      - "packages/docket-runtime/docs/**"
      - "CHANGELOG.md"
      - ".github/workflows/docs-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; never cancel one that's already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Docs site build (strict)
        run: uvx --with mkdocs-material --with 'mkdocstrings[python]' mkdocs build --strict

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
